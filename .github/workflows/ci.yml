name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: syntax + smoke (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: bash syntax check
        run: |
          bash -n mactune
          sh -n install.sh

      - name: flags
        run: |
          ./mactune --version
          ./mactune --help >/dev/null
          if ./mactune --bogus 2>/dev/null; then echo "should have failed"; exit 1; fi

      - name: dry run (read-only full pass)
        run: ./mactune --dry-run </dev/null

      - name: real run, non-interactive, no sudo
        run: ./mactune --no-sudo </dev/null

      - name: rollback path
        run: MODE=rollback ./mactune </dev/null

      - name: dry run changes nothing and claims nothing
        run: |
          out=$(./mactune --dry-run --no-sudo </dev/null)
          if printf '%s' "$out" | grep -q 'reclaimed'; then echo "dry run claimed reclaimed space"; exit 1; fi

      - name: history trend (second run reads the first)
        run: |
          ./mactune --no-sudo </dev/null >/dev/null
          test -f "$HOME/.config/mactune/history.csv"
          out=$(./mactune --no-sudo </dev/null)   # capture first: grep -q on a pipe can SIGPIPE mactune under pipefail
          printf '%s' "$out" | grep -q 'trend:'

      - name: reset flag clears saved answers
        run: |
          mkdir -p "$HOME/.config/mactune" && echo '__mode__=saved' > "$HOME/.config/mactune/answers.conf"
          RESET=1 ./mactune --dry-run </dev/null >/dev/null
          test ! -f "$HOME/.config/mactune/answers.conf"

      - name: installer (sandboxed prefix)
        run: |
          sh install.sh --prefix "$RUNNER_TEMP/bin"
          "$RUNNER_TEMP/bin/mactune" --version

      - name: installer rejects a bare --prefix
        run: |
          if sh install.sh --prefix 2>/dev/null; then echo "should have failed"; exit 1; fi
